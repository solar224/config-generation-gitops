apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/solar224/config-generation-gitops
    targetRevision: GCP
    path: apps
    directory:
      # REQUIRED: without recurse: true, ArgoCD only reads the apps/ root directory
      # and silently ignores production/, staging/, infrastructure/ subdirectories.
      # The root Application will show Synced but create zero child Applications.
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
