## CoreDNS hairpin override ArgoCD Application.
##
## GKE branch: this Application is disabled.
## On GKE, pods reach external IPs (auth.ycantech.com → GCP LB) directly
## through the GCP network — no hairpin rewrite needed.
## Re-enable (remove the `enabled: false` annotation / uncomment) only when
## running on Kind or kubeadm where hairpin NAT is a limitation.
##
## Kind branch: re-enable and uncomment the rewrite lines in
## infrastructure/coredns/configmap.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coredns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://github.com/solar224/config-generation-gitops
    targetRevision: GCP
    path: infrastructure/coredns
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  # GKE: sync is disabled — do NOT overwrite GKE's managed CoreDNS ConfigMap.
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - ServerSideApply=true
  # Ignore all differences so ArgoCD stays green without touching CoreDNS.
  ignoreDifferences:
    - group: ""
      kind: ConfigMap
      name: coredns
      namespace: kube-system
      jsonPointers:
        - /data
