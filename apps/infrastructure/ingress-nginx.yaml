## ingress-nginx ArgoCD Application
## Chart: ingress-nginx/ingress-nginx v4.15.1
##
## sync-wave: "-1" — syncs before app Applications so the Ingress controller
## is ready before config-gen Ingress resources are applied in Phase 3.
##
## Values are kind-cluster specific (hostPort, nodeSelector, tolerations).
## See infrastructure/ingress-nginx/values.yaml for cloud migration notes.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  sources:
    - repoURL: https://kubernetes.github.io/ingress-nginx
      chart: ingress-nginx
      targetRevision: 4.15.1
      helm:
        valueFiles:
          - $gitops/infrastructure/ingress-nginx/values.yaml
    - repoURL: https://github.com/solar224/config-generation-gitops
      targetRevision: GCP
      ref: gitops
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
