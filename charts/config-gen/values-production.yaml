# Image tags are updated automatically by the CD pipeline (cd-build-push.yml).
# Do not edit manually.
image:
  backend:
    tag: "latest"
  frontend:
    tag: "latest"

ingress:
  host: app.yourdomain.com
  clusterIssuer: letsencrypt-prod

infisical:
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: ""   # REQUIRED: set to your Infisical project slug
        envSlug: prod
