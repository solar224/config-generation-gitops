# Image tags are updated automatically by the CD pipeline (cd-build-push.yml).
# Do not edit manually.
image:
  backend:
    tag: "b6df090b82a405e016086132d1d3b16522432e44"
  frontend:
    tag: "b6df090b82a405e016086132d1d3b16522432e44"
ingress:
  host: app.ycantech.com
  clusterIssuer: letsencrypt-prod
database:
  instances: 2          # 1 primary + 1 hot-standby replica → automatic failover
  storage:
    size: 10Gi
    storageClass: premium-rwo  # GKE SSD-backed PV (pd-ssd); higher IOPS for production
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Enable GCS backup for production.
  # Prerequisites: create the bucket and bind Workload Identity (see backup.yaml comments).
  backup:
    enabled: true
    schedule: "0 2 * * *"
    retentionPolicy: "14d"
    destinationPath: "gs://ycantech-db-backup/production/config-gen"
pgbouncer:
  instances: 2           # 2 PgBouncer pods for connection-pool HA
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 64Mi
backend:
  replicaCount: 2        # always ≥ 2 replicas; PDB ensures 1 stays up during rolling
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi
  hpa:
    minReplicas: 2       # never scale below 2
    maxReplicas: 4
  topologySpread:
    enabled: true        # spread across GKE zones
    maxSkew: 1
    whenUnsatisfiable: ScheduleAnyway
frontend:
  replicaCount: 2
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
  hpa:
    minReplicas: 2
    maxReplicas: 4
  topologySpread:
    enabled: true
    maxSkew: 1
    whenUnsatisfiable: ScheduleAnyway
infisical:
  enabled: false
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: ""
        envSlug: prod
oidc:
  enabled: true
  issuerURL: https://auth.ycantech.com
  clientID: config-gen-production
  redirectURL: https://app.ycantech.com/api/auth/oidc/callback
  providerName: Dex (GitHub)
  scopes: openid profile email
  superuserEmails:
    - cyc.cs14@nycu.edu.tw
  allowedEmailDomains:
    - nycu.edu.tw
  clientSecretRef:
    name: config-gen-oidc-secret
    key: OIDC_CLIENT_SECRET
  # On GKE the ingress-nginx ClusterIP is unpredictable; CoreDNS hairpin rewrite
  # (infrastructure/coredns/configmap.yaml) routes auth.ycantech.com to the
  # ingress-nginx service DNS name cluster-internally, so hostAliases are not needed.
  hostAliases: []
