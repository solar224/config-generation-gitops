ingress:
  host: staging.yourdomain.com
  clusterIssuer: letsencrypt-staging

backend:
  replicaCount: 1

frontend:
  replicaCount: 1

database:
  clusterName: config-gen-staging-db
  instances: 1
  storage:
    size: 5Gi

pgbouncer:
  instances: 1

infisical:
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: ""   # REQUIRED: set to your Infisical project slug
        envSlug: staging
