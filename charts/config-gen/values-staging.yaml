image:
  backend:
    tag: "063bbe8183d8daa4320593f562d191fcd4ab5833"
  frontend:
    tag: "063bbe8183d8daa4320593f562d191fcd4ab5833"
ingress:
  host: staging.ycantech.com
  clusterIssuer: letsencrypt-prod
database:
  clusterName: config-gen-staging-db
  instances: 1
  storage:
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
pgbouncer:
  instances: 1
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 64Mi
backend:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi
  hpa:
    minReplicas: 1
    maxReplicas: 2
frontend:
  replicaCount: 1
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
  hpa:
    minReplicas: 1
    maxReplicas: 2
infisical:
  enabled: false
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: ""
        envSlug: staging
oidc:
  enabled: true
  issuerURL: https://auth.ycantech.com
  clientID: config-gen-staging
  redirectURL: https://staging.ycantech.com/api/auth/oidc/callback
  providerName: Dex (GitHub)
  scopes: openid profile email
  superuserEmails:
    - cyc.cs14@nycu.edu.tw
  allowedEmailDomains:
    - nycu.edu.tw
  clientSecretRef:
    name: config-gen-oidc-secret
    key: OIDC_CLIENT_SECRET
  hostAliases:
    - ip: 10.96.95.35
      hostnames:
        - auth.ycantech.com
