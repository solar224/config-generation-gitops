{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "config-gen.backend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "config-gen.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  podSelector:
    matchLabels:
      {{- include "config-gen.backend.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Allow frontend to reach backend on port 8080
    - from:
        - podSelector:
            matchLabels:
              {{- include "config-gen.frontend.selectorLabels" . | nindent 14 }}
      ports:
        - port: 8080
          protocol: TCP
    # Allow ingress-nginx to reach backend directly on port 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
          protocol: TCP
    # Allow Prometheus to scrape /metrics on port 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
          protocol: TCP

  egress:
    # Allow backend to reach PostgreSQL directly on port 5432
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ .Values.database.clusterName }}
      ports:
        - port: 5432
          protocol: TCP
    # Allow backend to reach PgBouncer on port 5432
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/poolerName: {{ .Values.database.clusterName }}-pgbouncer
      ports:
        - port: 5432
          protocol: TCP
    # Allow DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
