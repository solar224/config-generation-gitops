apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "config-gen.fullname" . }}-migrate-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "config-gen.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # Run before sync; delete the Job after it succeeds
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "config-gen.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: "{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}"
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          command:
            - /usr/local/bin/migrate
            - -path=/migrations
            - -database=$(DATABASE_DIRECT_URL)
            - up
          envFrom:
            - secretRef:
                name: {{ .Values.infisical.managedSecretName }}
