apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "config-gen.fullname" . }}-migrate-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "config-gen.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # Run after all resources are Healthy (DB cluster ready, secret exists)
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "config-gen.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: "{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}"
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          command:
            - /usr/local/bin/migrate
            - -path=/migrations
            - -database=$(DATABASE_DIRECT_URL)
            - up
          envFrom:
            - secretRef:
                name: {{ .Values.infisical.managedSecretName }}
          env:
            # DATABASE_DIRECT_URL comes from the CNPG-created secret (bypasses PgBouncer)
            - name: DATABASE_DIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.clusterName }}-app
                  key: uri
