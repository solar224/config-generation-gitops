apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.database.clusterName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "config-gen.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  instances: {{ .Values.database.instances }}

  bootstrap:
    initdb:
      database: {{ .Values.database.bootstrap.dbName }}
      owner: {{ .Values.database.bootstrap.ownerName }}

  storage:
    size: {{ .Values.database.storage.size }}
    {{- if .Values.database.storage.storageClass }}
    storageClass: {{ .Values.database.storage.storageClass }}
    {{- end }}

  resources:
    {{- toYaml .Values.database.resources | nindent 4 }}

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"
      effective_cache_size: "512MB"

  # Primary service — backend connects via PgBouncer (Pooler) to this
  # Standby service — can be used for read replicas
  # CloudNativePG creates: {clusterName}-rw, {clusterName}-ro, {clusterName}-r

  {{- if .Values.database.backup.enabled }}
  # Continuous WAL archiving + base backup to GCS.
  # Uses GKE Workload Identity — no static credentials required.
  # RPO ≤ 5 min (WAL shipping interval), RTO ≤ 30s (standby auto-promotion).
  backup:
    retentionPolicy: {{ .Values.database.backup.retentionPolicy | quote }}
    barmanObjectStore:
      googleCredentials:
        # Workload Identity: the CNPG service account is bound to a GCP SA
        # with roles/storage.objectAdmin on the backup bucket.
        gkeEnvironment: true
      destinationPath: {{ .Values.database.backup.destinationPath | quote }}
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
        immediateCheckpoint: false
        jobs: 2
  {{- end }}
