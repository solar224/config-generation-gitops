apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "config-gen.backend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "config-gen.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "config-gen.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "config-gen.backend.selectorLabels" . | nindent 8 }}
      annotations:
        # Trigger rolling restart when the managed secret changes
        reloader.stakater.com/auto: "true"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "config-gen.backend.selectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
      containers:
        - name: backend
          image: "{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}"
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ .Values.infisical.managedSecretName }}
          env:
            # DATABASE_URL is sourced directly from the CloudNativePG-managed secret
            # so it works regardless of whether Infisical is enabled.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.clusterName }}-app
                  key: uri
            - name: DB_MAX_OPEN_CONNS
              value: {{ .Values.backend.env.DB_MAX_OPEN_CONNS | quote }}
            - name: DB_MAX_IDLE_CONNS
              value: {{ .Values.backend.env.DB_MAX_IDLE_CONNS | quote }}
            - name: DB_CONN_MAX_LIFETIME
              value: {{ .Values.backend.env.DB_CONN_MAX_LIFETIME | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
