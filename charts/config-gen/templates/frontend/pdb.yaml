apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "config-gen.frontend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "config-gen.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  minAvailable: {{ .Values.frontend.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "config-gen.frontend.selectorLabels" . | nindent 6 }}
