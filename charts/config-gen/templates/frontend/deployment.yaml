apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "config-gen.frontend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "config-gen.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "config-gen.frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "config-gen.frontend.selectorLabels" . | nindent 8 }}
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "config-gen.frontend.selectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "config-gen.frontend.fullname" . }}-nginx
      containers:
        - name: frontend
          image: "{{ .Values.image.frontend.repository }}:{{ .Values.image.frontend.tag }}"
          imagePullPolicy: {{ .Values.image.frontend.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}

        - name: nginx-exporter
          image: "{{ .Values.frontend.exporter.image.repository }}:{{ .Values.frontend.exporter.image.tag }}"
          args:
            - --nginx.scrape-uri=http://127.0.0.1/nginx-status
          ports:
            - name: metrics
              containerPort: 9113
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            {{- toYaml .Values.frontend.exporter.resources | nindent 12 }}
