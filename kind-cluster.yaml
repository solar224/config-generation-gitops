## kind cluster configuration for config-gen local development
## Docs: https://kind.sigs.k8s.io/docs/user/configuration/
##
## Create:  kind create cluster --name config-gen --config kind-cluster.yaml
## Delete:  kind delete cluster --name config-gen
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    ## Label the node so ingress-nginx DaemonSet / NodePort can schedule here (Phase 1).
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    ## Expose host ports 80/443 so ingress-nginx can receive traffic
    ## from your browser / curl on the host machine (Phase 1 onwards).
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
