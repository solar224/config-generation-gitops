## kube-prometheus-stack Helm values
## Chart: prometheus-community/kube-prometheus-stack v85.2.0
## Repo:  https://prometheus-community.github.io/helm-charts
##
## Phase 1 — Prometheus + Grafana + Alertmanager
## Namespace: monitoring (created via ArgoCD syncOptions: CreateNamespace=true)

prometheus:
  prometheusSpec:
    ## CRITICAL: kube-prometheus-stack defaults to
    ##   serviceMonitorSelectorNilUsesHelmValues: true
    ## which restricts Prometheus to only scrape ServiceMonitors from the same
    ## Helm release (namespace: monitoring). ServiceMonitors in config-gen and
    ## config-gen-staging would be silently ignored.
    ##
    ## Set all three to false / {} to discover ServiceMonitors across ALL namespaces.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}          ## select ALL ServiceMonitors
    serviceMonitorNamespaceSelector: {} ## across ALL namespaces

    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}

    ## Retain metrics for 15 days
    retention: 15d

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi

grafana:
  ## Pin to Grafana 11.x — Grafana 13's embedded App Platform apiserver causes
  ## all auth to time out (context canceled) on kind/dev clusters, resulting in
  ## a liveness-probe crash loop. Grafana 11.5.2 is the latest stable LTS.
  image:
    tag: "11.5.2"

  ## TODO: inject via Infisical / K8s secret in production.
  ## Change before exposing Grafana publicly.
  adminPassword: admin

  persistence:
    enabled: true
    size: 2Gi

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  ## Pre-provision a datasource for Prometheus
  sidecar:
    datasources:
      enabled: true
    dashboards:
      enabled: true
      # Discover dashboards in all namespaces (needed for app-level dashboard ConfigMaps)
      searchNamespace: ALL
      label: grafana_dashboard
      labelValue: "1"

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

prometheusOperator:
  admissionWebhooks:
    ## Use cert-manager (already installed in Phase 0/1) to issue the admission
    ## webhook TLS cert. This eliminates the kube-prometheus-stack-admission-create
    ## and kube-prometheus-stack-admission-patch Jobs which, when pruned by ArgoCD,
    ## cause a sync retry loop ("Resource ... is missing, might have been deleted").
    certManager:
      enabled: true
    ## Disable the built-in patch Jobs (replaced by cert-manager above)
    patch:
      enabled: false
