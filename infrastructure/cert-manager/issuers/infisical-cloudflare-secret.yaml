## InfisicalSecret — syncs CF_API_TOKEN from Infisical Cloud into
## the cert-manager namespace as "cloudflare-api-token-secret".
##
## Bootstrap prerequisite (one-time, NOT in git):
##   kubectl create secret generic infisical-machine-identity-cert-manager \
##     --from-literal=clientId=<clientId> \
##     --from-literal=clientSecret=<clientSecret> \
##     -n cert-manager
##
## The secret "cloudflare-api-token-secret" created here is referenced by
## both ClusterIssuers (letsencrypt-staging, letsencrypt-prod) for DNS-01.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  hostAPI: https://app.infisical.com/api
  resyncInterval: 60

  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-machine-identity-cert-manager
        secretNamespace: cert-manager
      secretsScope:
        projectSlug: "config-generation-infra-jl4q"
        envSlug: "dev"
        secretsPath: "/"
        recursive: false

  managedSecretReference:
    secretName: cloudflare-api-token-secret
    secretNamespace: cert-manager
    creationPolicy: Owner
    template:
      includeAllSecrets: false
      data:
        api-token: "{{ .CF_API_TOKEN }}"
