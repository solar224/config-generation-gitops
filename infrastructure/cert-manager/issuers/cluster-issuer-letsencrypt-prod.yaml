## Let's Encrypt PRODUCTION ClusterIssuer
##
## Issues trusted TLS certificates automatically via HTTP01 challenge.
## Rate limited: 50 certs/domain/week — use letsencrypt-staging first to verify.
##
## Prerequisites:
##   - A real public domain with DNS A record pointing to your cluster's ingress IP
##   - Port 80 must be reachable from the internet (required for HTTP01 challenge)
##   - TODO: replace your@email.com with a real email address
##
## Usage in Ingress (Phase 3):
##   annotations:
##     cert-manager.io/cluster-issuer: letsencrypt-prod
##   tls:
##     - hosts: [app.yourdomain.com]
##       secretName: config-gen-tls
##
## sync-wave: "1" — applied after cert-manager webhook is ready.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # TODO: replace with your email (used for expiry notifications)
    email: your@email.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
