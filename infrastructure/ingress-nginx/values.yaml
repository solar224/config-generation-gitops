## ingress-nginx Helm values
## Chart: ingress-nginx/ingress-nginx v4.15.1
## Repo:  https://kubernetes.github.io/ingress-nginx
##
## GCP (GKE) configuration:
##   GKE provisions a Google Cloud External TCP Load Balancer automatically
##   when service.type=LoadBalancer. The LB's external IP becomes the A record
##   for ycantech.com / staging.ycantech.com / auth.ycantech.com.
##
##   After ArgoCD syncs, retrieve the assigned IP with:
##     kubectl get svc -n ingress-nginx ingress-nginx-controller \
##       -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
##   Then update your DNS provider (Cloudflare) to point all three hostnames
##   at that IP. cert-manager will issue TLS certs via DNS-01 (Cloudflare)
##   automatically once DNS propagates.

controller:
  ## Rolling update ensures zero-downtime upgrades
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1

  ## GKE: use a cloud LoadBalancer (GCP provisions an external IP automatically)
  service:
    type: LoadBalancer
    ## Optional: reserve a static IP in GCP first and reference it here:
    ##   gcloud compute addresses create ingress-nginx-ip --region=<region>
    ## Then uncomment:
    # loadBalancerIP: "x.x.x.x"
    ## Optional annotations for GCP (e.g. backend service timeout):
    annotations: {}

  ## Allow Ingress resources without explicit ingressClassName annotation.
  ## Keeps all existing Ingress manifests working without adding annotations.
  watchIngressWithoutClass: true

  ## Allow enough time for GCP LB health-check drain before pod termination
  terminationGracePeriodSeconds: 60

  ## Forward real client IP to backend pods.
  ## On GKE with proxy-protocol disabled (the default), use X-Forwarded-For.
  config:
    use-forwarded-headers: "true"
    compute-full-forwarded-for: "true"
    use-proxy-protocol: "false"

  resources:
    requests:
      cpu: 100m
      memory: 90Mi
    limits:
      cpu: 500m
      memory: 256Mi

  ## Enable Prometheus metrics endpoint (scraped by kube-prometheus-stack)
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false  # ServiceMonitor created by kube-prometheus-stack instead
