## ingress-nginx Helm values
## Chart: ingress-nginx/ingress-nginx v4.15.1
## Repo:  https://kubernetes.github.io/ingress-nginx
##
## Phase 1 — managed by ArgoCD (apps/infrastructure/ingress-nginx.yaml)
##
## ⚠️  kind-cluster specific configuration:
##   The kind cluster (kind-cluster.yaml) has extraPortMappings 80/443 → host.
##   This config binds the ingress-nginx pod directly to those host ports via
##   hostPort, so traffic on localhost:80 / localhost:443 reaches ingress-nginx.
##
##   For a cloud provider (GKE / EKS / AKS):
##   - Remove hostPort, nodeSelector, tolerations blocks
##   - Change service.type to LoadBalancer
##   - Remove watchIngressWithoutClass (use IngressClass annotation instead)

controller:
  ## Rolling update ensures zero-downtime upgrades
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1

  ## Bind directly to host ports mapped in kind-cluster.yaml extraPortMappings.
  ## Without this, the kind port mappings have nothing to forward to.
  hostPort:
    enabled: true

  ## Shorten termination to avoid delaying pod deletion in kind (no LB drain)
  terminationGracePeriodSeconds: 0

  ## NodePort: required for kind (no cloud LoadBalancer provisioner available)
  service:
    type: NodePort

  ## Allow Ingress resources without explicit ingressClassName annotation
  ## (avoids needing to update all Ingress manifests in Phase 3)
  watchIngressWithoutClass: true

  ## Only schedule on the node labeled ingress-ready=true
  ## This label is set in kind-cluster.yaml kubeadmConfigPatches
  nodeSelector:
    ingress-ready: "true"

  ## kind control-plane nodes have a taint; tolerate it so ingress-nginx
  ## can schedule on the single-node kind cluster
  tolerations:
    - effect: NoSchedule
      key: node-role.kubernetes.io/control-plane
      operator: Equal
    - effect: NoSchedule
      key: node-role.kubernetes.io/master
      operator: Equal

  ## Forward real client IP to backend pods
  config:
    use-forwarded-headers: "true"
    compute-full-forwarded-for: "true"
    use-proxy-protocol: "false"

  resources:
    requests:
      cpu: 100m
      memory: 90Mi
    limits:
      cpu: 500m
      memory: 256Mi

  ## Enable Prometheus metrics endpoint (scraped by kube-prometheus-stack)
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false  # ServiceMonitor created by kube-prometheus-stack instead
