## CoreDNS ConfigMap with hairpin entries for in-cluster traffic.
##
## Why this exists:
## Backend pods need to resolve OIDC issuer URLs (e.g. https://auth.ycantech.com)
## from inside the cluster. External DNS resolves these to the host's public IP,
## but the host can't route back into the cluster's ingress (no hairpin NAT).
## We rewrite those hostnames to the ingress-nginx Service so traffic stays
## inside the cluster.
##
## This file overrides the default ConfigMap that Kind/kubeadm installs.
## ArgoCD owns it via server-side apply.
##
## To add a new public hostname: add another `rewrite name` line below.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health {
           lameduck 5s
        }
        ready
        rewrite name staging.ycantech.com ingress-nginx-controller.ingress-nginx.svc.cluster.local
        rewrite name app.ycantech.com     ingress-nginx-controller.ingress-nginx.svc.cluster.local
        rewrite name auth.ycantech.com    ingress-nginx-controller.ingress-nginx.svc.cluster.local
        kubernetes cluster.local in-addr.arpa ip6.arpa {
           pods insecure
           fallthrough in-addr.arpa ip6.arpa
           ttl 30
        }
        prometheus :9153
        forward . /etc/resolv.conf {
           max_concurrent 1000
        }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }
