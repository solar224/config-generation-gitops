## CoreDNS ConfigMap — GKE branch
##
## On Kind/kubeadm: uncomment the `rewrite` lines (hairpin NAT workaround).
## On GKE: those lines are NOT needed because GKE pods can reach external IPs
## directly through the GCP network. Overriding GKE's managed CoreDNS ConfigMap
## with rewrite rules is unnecessary and risks breaking cluster DNS.
##
## This file is intentionally minimal so ArgoCD (server-side apply) leaves
## GKE's existing CoreDNS configuration intact.
## The coredns Application syncs only this file; since the data section is
## absent, ArgoCD will NOT patch the ConfigMap — it only ensures the resource
## exists as declared.
##
## If you ever need in-cluster hairpin resolution (e.g., custom on-prem cluster):
##   1. Add the rewrite lines below under `data.Corefile`
##   2. Make sure NodeLocal DNSCache is disabled or handles the rewrites too
##
## rewrite name staging.ycantech.com ingress-nginx-controller.ingress-nginx.svc.cluster.local
## rewrite name app.ycantech.com     ingress-nginx-controller.ingress-nginx.svc.cluster.local
## rewrite name auth.ycantech.com    ingress-nginx-controller.ingress-nginx.svc.cluster.local
